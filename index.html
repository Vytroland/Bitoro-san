<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktivní mapa Boleslavska</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="map-wrapper">
        <svg id="mapa-boleslav" viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg">
            <image href="Mapa.png" x="0" y="0" width="800" height="1100" />

            <g id="mnichovo-hradiste" class="map-point" data-id="mnichovo">
                <circle class="outer-ring" cx="420" cy="150" r="18" fill="#27ae60" />
                <circle class="inner-dot" cx="420" cy="150" r="6" fill="white" />
            </g>

            </svg>
    </div>

    <div id="info-panel">
        <div class="panel-content">
            <h2 id="p-title">Vyberte místo na mapě</h2>
            <div id="p-badge" class="badge"></div>
            <img id="p-img" src="" alt="" style="width:100%; display:none; border-radius:8px; margin:15px 0;">
            <p id="p-desc">Kliknutím na bod na mapě zobrazíte podrobnosti o daném místě.</p>
            <ul id="p-features"></ul>
            <button onclick="document.getElementById('info-panel').style.display='none'">Zavřít</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
