<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Průvodce Mladoboleslavskem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="map-wrapper">
        <img src="Mapa.png" alt="Mapa" class="map-image">
        
        <div class="dot" style="top: 15%; left: 56%;" data-id="mnichovo" data-name="Mnichovo Hradiště"></div>
        <div class="dot" style="top: 28%; left: 30%;" data-id="bela" data-name="Bělá p. Bezdězem"></div>
        <div class="dot" style="top: 45%; left: 53%;" data-id="boleslav" data-name="Mladá Boleslav"></div>
        <div class="dot" style="top: 48%; left: 49%;" data-id="michalovice" data-name="Michalovice"></div>
        <div class="dot" style="top: 63%; left: 74%;" data-id="loucen" data-name="Zámek Loučeň"></div>
        <div class="dot" style="top: 74%; left: 44%;" data-id="benatky" data-name="Benátky n. Jizerou"></div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="m-title"></h2>
            <img id="m-img" src="">
            <button class="close-btn" id="closeBtn">ZAVŘÍT</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
